<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Assistance</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <img src="images/logo.png" alt="Logo">
        </div>

        <h3>ICT HELPDESK</h3>

        <nav class="sidebar-menu">

            <a href="index.html">
                <i class="fa-solid fa-table-columns"></i>
                Dashboard
            </a>

            <a href="request.html" class="active">
                <i class="fa-solid fa-circle-question"></i>
                Request Assistance
            </a>

            <a href="history.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Ticket History
            </a>

            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Profile
            </a>

        </nav>

        <a href="login.html" class="logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>

    </aside>

    <!-- Main Content -->

    <main>

        <div class="breadcrumb">
            National Treasury / <strong>Request Assistance</strong>
        </div>

        <div class="page-header">
            <h1>Raise a New Ticket</h1>
            <p>Fill in the details below to submit your ICT issue.</p>
        </div>

        <div class="ticket-form">

            <form>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" value="Ivy Wanjiku Njuguna" readonly>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" value="ivy@gmail.com" readonly>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" value="ICT Department" readonly>
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <select required>

                        <option>Select Category</option>
                        <option>Hardware</option>
                        <option>Software</option>
                        <option>Network</option>
                        <option>Email</option>
                        <option>Printer</option>
                        <option>Password Reset</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Priority</label>

                    <select required>

                        <option>Select Priority</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Critical</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Issue Title</label>

                    <input
                    type="text"
                    placeholder="Enter issue title"
                    required>

                </div>

                <div class="form-group">

                    <label>Description</label>

                    <textarea
                    rows="6"
                    placeholder="Describe your issue..."
                    required></textarea>

                </div>

                <div class="buttons">

                    <button
                        type="button"
                        class="submit-btn"
                        onclick="alert('Ticket Submitted Successfully!'); window.location.href='history.html';">

                        <i class="fa-solid fa-paper-plane"></i>
                        Submit Ticket

                    </button>

                    <button
                        type="reset"
                        class="cancel-btn"
                        onclick="alert('Form Cleared!');">

                        Clear Form

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
